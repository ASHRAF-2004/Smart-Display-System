name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m compileall -q app.py security.py scripts tests
      - name: Isolated smoke and integration tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax check
        run: node --check upgrade.js

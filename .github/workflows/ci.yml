name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile
        run: python -m compileall -q app.py security.py scripts tests
      - name: Isolated smoke and integration tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax check
        run: |
          node --check upgrade.js
          python scripts/check_inline_js.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real TV rendering and visibility
        run: python e2e/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
